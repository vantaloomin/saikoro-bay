name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lint sim rules
        run: python3 tools/lint_sim.py

      - name: Lint adult content references
        run: python3 tools/lint_content.py

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Check every script compiles (typing warnings are errors)
        run: godot --headless --path . -s res://tools/check_scripts.gd

      - name: Run tests
        run: godot --headless --path . -s res://addons/gut/gut_cmdln.gd

      - name: Delve maps follow every rule (10,000 seeds)
        run: godot --headless --path . -s res://tools/check_maps.gd -- --seeds=10000

      # Balance band (plan section 8): a fresh kit should clear about 40-60% of
      # delves. The greedy bot is the floor; the planner is the ceiling, and a
      # ceiling near 100% means skill stops mattering.

      - name: Balance band, greedy bot
        run: godot --headless --path . -s res://tools/run_bot.gd -- --bot=greedy --seeds=2000 --min-win=40 --max-win=60

      - name: Balance band, planner bot
        run: godot --headless --path . -s res://tools/run_bot.gd -- --bot=planner --seeds=200 --min-win=60 --max-win=92

  build:
    name: Export Windows builds (full and SFW)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # The full template archive is 1.2 GB; only the Windows template is
      # kept, so the cache stays around 100 MB.
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-windows

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -q /tmp/templates.tpz \
            templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe \
            templates/version.txt \
            -d "$dest"
          rm /tmp/templates.tpz

      - name: Import project
        run: godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/full/windows build/sfw/windows
          godot --headless --path . --export-release "Windows" build/full/windows/SaikoroBay.exe
          godot --headless --path . --export-release "Windows SFW" build/sfw/windows/SaikoroBay.exe
          test -s build/full/windows/SaikoroBay.exe
          test -s build/sfw/windows/SaikoroBay.exe

      - name: Check the SFW build has no adult content
        run: |
          godot --headless --path . --export-pack "Windows SFW" build/sfw/check.pck
          python3 tools/check_pck.py build/sfw/check.pck

      - uses: actions/upload-artifact@v4
        with:
          name: saikoro-bay-windows-${{ github.sha }}
          path: build/full/windows/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: saikoro-bay-windows-sfw-${{ github.sha }}
          path: build/sfw/windows/
          retention-days: 14
