name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lint sim rules
        run: python3 tools/lint_sim.py

      - name: Lint adult content references
        run: python3 tools/lint_content.py

      - name: Export presets come in full and SFW pairs
        run: python3 tools/check_presets.py

      - name: The SFW pack check catches what it's for
        run: python3 tools/check_pck.py --self-test

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Check every script compiles (typing warnings are errors)
        run: godot --headless --path . -s res://tools/check_scripts.gd

      - name: Run tests
        run: godot --headless --path . -s res://addons/gut/gut_cmdln.gd

      - name: Delve maps follow every rule (10,000 seeds)
        run: godot --headless --path . -s res://tools/check_maps.gd -- --seeds=10000

      # Balance band (plan section 8): a fresh kit should clear Koban's vault on
      # about 40-60% of whole delves on generated maps. The delve bot picks the
      # path and landings, the room and vault bots play those rooms, and the
      # named bot plays the fights. Greedy is the floor; the planner is the
      # ceiling. Most of the band is decided at the vault, so its conversion
      # (cleared / reached) has its own check.

      - name: Balance band, greedy bot, whole delves
        run: godot --headless --path . -s res://tools/run_bot.gd -- --bot=greedy --seeds=2000 --min-win=40 --max-win=60 --min-vault=50 --max-vault=75

      - name: Balance band, planner bot, whole delves
        run: godot --headless --path . -s res://tools/run_bot.gd -- --bot=planner --seeds=200 --min-win=45 --max-win=70

      # Fight skill on its own (the M1 stand-in: six fights in a row). In whole
      # delves the same room and vault bots play for both, so this is where a
      # better fighter has to show. A ceiling near 100% means skill stops
      # mattering.

      - name: Fight skill, greedy bot
        run: godot --headless --path . -s res://tools/run_bot.gd -- --scenario=delve --bot=greedy --seeds=2000 --min-win=40 --max-win=60

      - name: Fight skill, planner bot
        run: godot --headless --path . -s res://tools/run_bot.gd -- --scenario=delve --bot=planner --seeds=200 --min-win=60 --max-win=92

  build:
    name: Export Windows builds (full and SFW)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # The full template archive is 1.2 GB; only the Windows template is
      # kept, so the cache stays around 100 MB.
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-windows

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -q /tmp/templates.tpz \
            templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe \
            templates/version.txt \
            -d "$dest"
          rm /tmp/templates.tpz

      - name: Import project
        run: godot --headless --path . --import

      - name: Export the full build
        run: |
          mkdir -p build/full/windows
          godot --headless --path . --export-release "Windows" build/full/windows/SaikoroBay.exe
          test -s build/full/windows/SaikoroBay.exe

      # Adult art never enters git (content/adult/README.md), so this "full"
      # build has none: it's for testing the full-cap code path, never for
      # release. Real full builds are made on the maintainer's machine.
      # content/adult/ci_canary/ is a stand-in adult asset. Finding it in the
      # full pack proves the SFW check below can see adult files at all.
      - name: The full build carries the adult canary
        run: |
          godot --headless --path . --export-pack "Windows" build/full/check.pck
          python3 tools/check_pck.py --expect-adult build/full/check.pck

      # The SFW presets exclude content/adult/, but Godot's UID and script
      # class caches still list every file the project has, which would leak
      # the adult file names into the SFW pack. So SFW builds are exported
      # from a tree without the folder.
      - name: Remove adult content before the SFW exports
        run: |
          rm -rf content/adult
          godot --headless --path . --import

      - name: Export the SFW build
        run: |
          mkdir -p build/sfw/windows
          godot --headless --path . --export-release "Windows SFW" build/sfw/windows/SaikoroBay.exe
          test -s build/sfw/windows/SaikoroBay.exe

      # Packs need no export templates, so every SFW preset is checked, not
      # only the Windows one that ships from here.
      - name: Every SFW preset has no adult content
        run: |
          mkdir -p build/sfw/check
          grep -oP '^name="\K[^"]+ SFW(?="$)' export_presets.cfg > build/sfw/check/presets.txt
          test -s build/sfw/check/presets.txt
          packs=()
          while IFS= read -r preset; do
            pack="build/sfw/check/${preset// /_}.pck"
            godot --headless --path . --export-pack "$preset" "$pack"
            packs+=("$pack")
          done < build/sfw/check/presets.txt
          python3 tools/check_pck.py "${packs[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: saikoro-bay-windows-${{ github.sha }}
          path: build/full/windows/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: saikoro-bay-windows-sfw-${{ github.sha }}
          path: build/sfw/windows/
          retention-days: 14
