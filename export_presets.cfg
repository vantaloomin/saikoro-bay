; Export presets: every platform in a full and a SFW variant.
; SFW presets add the "sfw" feature tag (caps the content level) and
; exclude content/adult/ entirely. No credentials live in this file.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*, tmp/*, addons/gut/*, .github/*"
export_path="build/full/windows/SaikoroBay.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Saikoro Bay"
application/file_description="Saikoro Bay"
application/copyright=""

